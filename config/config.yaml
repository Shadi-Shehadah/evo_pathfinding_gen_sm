

material_properties:
  segment_elastic_modulus: 200  # in  GPA
  thickness: 2        # in mm
  width: 40              # in mm
  density: 0.000008      # in kg/mm^3

design_rules:
  min_flange_length: 5  # in mm
  max_flange_length: 150 # in mm
  min_bend_angle: 35    # in degrees
  clearance: 0 # mm


prm:
  bend_weight: 1          # as opposed to 1 for length
  genetic_weight: 30       # as opposed to 1 for length
  genotype_sensitivity:  8   # 
  node_count: 120


grid-based:
  bend_weight: 1          # as opposed to 1 for length
  genetic_weight: 10       # as opposed to 1 for length
  genotype_sensitivity:  5   # 
  node_spacing: 5


fitness:
  bend_cost: 800             # unitless cost per bend
  mass_cost: 1000            # unitless cost per kg
  deflection_cost: 4000  # unitless cost per m deflection


genetic_algorithm:
  blob_radius: 15        # mm
  mutation_distance: 30  # mm
  crossover_rate: 0.4
  mutation_rate: 0.4
  max_age: 8  # generations
  prm_initial_nodes: 40
  mutation_shift_probability: 0.5 # the chance that a mutation is a shift rather than an invert
  grid_based_probability: 0.1
  min_fitness_threshold: -30 


