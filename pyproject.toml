[project]
name = "evo_pathfinding_gen_sm"
version = "0.0"
authors = [
    { name = "Shadi Shehadah", email = "Shadi.Shehadah@gmail.com" }
]
readme = "README.md"

dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "networkx",
    "shapely"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]